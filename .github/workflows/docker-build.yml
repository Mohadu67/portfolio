name: Build & Push Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mohadu67/curriculum

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 62326
          script: |
            set -e
            cd /home/moha/srv-docker/projects/portfolio

            # Preserve VPS-specific docker-compose.yml (different volumes/network names)
            # We pull the rest of the repo and rebuild locally with the VPS compose.
            cp docker-compose.yml docker-compose.yml.vps-working || true

            # Stash any local modifications before pulling
            git stash push -u -m "ci-deploy-$(date +%s)" docker-compose.yml Dockerfile 2>/dev/null || true

            git fetch origin main
            git reset --hard origin/main

            # Restore the working compose; trust the Dockerfile from repo
            if [ -f docker-compose.yml.vps-working ]; then
              cp docker-compose.yml.vps-working docker-compose.yml
            fi

            # Build & restart only the app (mongodb stays up)
            docker compose build portfolio
            docker compose up -d portfolio

            echo "Deploiement termine"

  notify-deployment:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()
    steps:
      - name: Image pushed successfully
        run: |
          echo "Docker image pushed to ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-app:latest"
          echo "Ready to deploy on VPS"
