<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 230 230">
  <defs>
    <style>
      .gc-node { fill: #b8ddd1; stroke: #1d1d1b; stroke-width: 1.5; stroke-miterlimit: 10; }
      .gc-line { stroke: #f7b186; stroke-width: 2.5; stroke-miterlimit: 10; fill: none; stroke-linecap: round; }
      .gc-center { fill: #f7b186; stroke: #1d1d1b; stroke-width: 1.5; stroke-miterlimit: 10; }
      .gc-small { fill: #f7f6f2; stroke: #1d1d1b; stroke-width: 1; stroke-miterlimit: 10; }
    </style>
  </defs>
  <!-- Connection lines -->
  <line class="gc-line" x1="70" y1="72" x2="160" y2="72"/>
  <line class="gc-line" x1="160" y1="72" x2="115" y2="155"/>
  <line class="gc-line" x1="115" y1="155" x2="70" y2="72"/>
  <line class="gc-line" x1="115" y1="108" x2="70" y2="72"/>
  <line class="gc-line" x1="115" y1="108" x2="160" y2="72"/>
  <line class="gc-line" x1="115" y1="108" x2="115" y2="155"/>
  <!-- Outer nodes -->
  <circle class="gc-node" cx="70" cy="72" r="24"/>
  <circle class="gc-node" cx="160" cy="72" r="24"/>
  <circle class="gc-node" cx="115" cy="155" r="24"/>
  <!-- Center hub -->
  <circle class="gc-center" cx="115" cy="108" r="18"/>
  <!-- Inner dots on nodes -->
  <circle class="gc-small" cx="70" cy="72" r="8"/>
  <circle class="gc-small" cx="160" cy="72" r="8"/>
  <circle class="gc-small" cx="115" cy="155" r="8"/>
</svg>
