# Production Compose - Pull images from GHCR only (no build)
# Usage VPS : docker compose -f docker-compose.prod.yml up -d

services:
  mongodb:
    image: mongo:7
    container_name: portfolio-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-admin}
    volumes:
      - mongodb_portfolio_data:/data/db
      - mongodb_portfolio_config:/data/configdb
    networks:
      - portfolio-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    image: ghcr.io/mohadu67/curriculum-app:latest
    pull_policy: always
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASS:-admin}@mongodb:27017/stage_agent?authSource=admin
      API_SECRET: ${API_SECRET:?API secret required}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET required for scheduled jobs (weekly-prospect, run-relances, check-inbox)}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GMAIL_USER: ${GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY}
      FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET}
      SERPAPI_KEY: ${SERPAPI_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      PROFIL_NOM: ${PROFIL_NOM:-Mohammed Hamiani}
      PROFIL_FORMATION: ${PROFIL_FORMATION:-Concepteur Développeur Fullstack}
      PROFIL_COMPETENCES: ${PROFIL_COMPETENCES}
      PROFIL_EXPERIENCE: ${PROFIL_EXPERIENCE}
      PROFIL_RECHERCHE: ${PROFIL_RECHERCHE}
      PROFIL_DISPO: ${PROFIL_DISPO}
      PROFIL_PORTFOLIO_URL: ${PROFIL_PORTFOLIO_URL:-https://hamiani.mohammed.harmonith.fr}
      NODE_ENV: production
      PORT: 3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - portfolio-network
    volumes:
      - ./candidatureModel:/app/candidatureModel
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  portfolio-network:
    driver: bridge

volumes:
  mongodb_portfolio_data:
    external: true
    name: portfolio_mongodb_portfolio_data
  mongodb_portfolio_config:
    external: true
    name: portfolio_mongodb_portfolio_config
